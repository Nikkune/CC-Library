name: Build and Deploy to Lua Branch

on:
  push:
    branches:
      - typescript-main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Setup Lua branch
        run: |
          git fetch origin lua || true
          git checkout -b lua
          # Garder uniquement le dossier build/
          find . -mindepth 1 -maxdepth 1 ! -name 'build' ! -name '.git' -exec rm -rf {} +

      - name: Move build files to root
        run: |
          mv build/* .
          rmdir build
          
          git add .
          git commit -m "Update Lua files from typescript-main" || echo "No changes to commit"
          git push -f origin lua